  <style>
    :root, .sw-root {
      --sw-bg: #F4F1EC;
      --sw-ink: #1F2A2C;
      --sw-ink-soft: #6B7476;
      --sw-accent: #2F9E8F;
      --sw-font-display: "Noto Sans KR", -apple-system, system-ui, sans-serif;
      --sw-font-body: "Noto Sans KR", -apple-system, system-ui, sans-serif;
    }
    html, body { margin: 0; background: var(--sw-bg); }
    body { word-break: keep-all; -webkit-font-smoothing: antialiased; }
    .sw-copy__title { letter-spacing: -0.035em; line-height: 1.12; }
    .sw-copylayer .sw-copy:first-of-type .sw-copy__title { font-size: clamp(2.5rem, 5.4vw, 4.75rem); }
    .sw-copy__eyebrow { letter-spacing: 0.02em; text-transform: none; }
    .sw-btn--primary { background: var(--sw-accent); color: #FBFAF7; box-shadow: 0 10px 30px -10px color-mix(in srgb, var(--sw-accent) 70%, transparent); }
    .sw-btn--primary:hover { transform: translateY(-2px); }
    .legal { position: fixed; right: 16px; bottom: 10px; z-index: 40; font: 11px/1.4 var(--sw-font-body); color: var(--sw-ink-soft); opacity: .7; }
    @media (max-width: 860px) { .legal { display: none; } }
  </style>
</head>
