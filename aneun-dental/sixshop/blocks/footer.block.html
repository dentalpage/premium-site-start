    </fieldset>
    <div class="field-row">
      <div class="field"><label for="bk-date">희망 날짜<span class="opt">(선택)</span></label><input id="bk-date" name="date" type="date"></div>
      <fieldset class="field">
        <legend>희망 시간대</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="time" value="오전" checked><span>오전</span></label>
          <label class="chip"><input type="radio" name="time" value="오후"><span>오후</span></label>
          <label class="chip"><input type="radio" name="time" value="저녁"><span>저녁</span></label>
        </div>
      </fieldset>
    </div>
    <div class="field"><label for="bk-message">궁금한 점<span class="opt">(선택)</span></label><textarea id="bk-message" name="message" maxlength="1000" placeholder="불편한 증상이나 궁금한 점을 적어 주세요."></textarea></div>
    <div class="consent">
      <label><input type="checkbox" name="agree" required>개인정보 수집·이용에 동의합니다. (필수)</label>
      <details><summary>자세히 보기</summary><ul><li>수집 항목: 이름, 연락처, 이메일, 희망 진료·일시, 문의 내용</li><li>이용 목적: 진료 상담 및 예약 안내</li><li>보유 기간: 상담 완료 후 1년 뒤 파기</li></ul></details>
    </div>
    <p class="form-error" role="alert"></p>
    <button class="submit-btn" type="submit">예약 신청하기</button>
  </form>
  <div class="booking-done" hidden>
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="24" cy="24" r="21"/><path d="M15 24.5l6 6 12-13" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h3>예약 신청이 접수되었습니다.</h3>
    <p>진료 시간 내에 남겨주신 연락처로<br>전화드려 예약을 확정해 드릴게요.</p>
    <button class="dialog-confirm" data-close="" type="button">확인</button>
  </div>
</dialog>
<dialog id="section-dialog" aria-labelledby="section-title"><button class="dialog-close" type="button" data-close="" aria-label="안내 닫기">닫기 ×</button><div class="section-label">ANEUN DENTAL</div><h2 id="section-title">첫 방문 안내</h2><p>이 페이지는 홈페이지 판매 샘플입니다.<br>실제 병원 적용 시 해당 안내와 서비스로 연결됩니다.</p><button class="dialog-confirm" data-close="" type="button">확인</button></dialog></div></div>
</template>

<script>
  const container = bm.container;
  const $ = (sel) => container.querySelector(sel);
  function open(id) { const d = $(id); if (d && !d.open) d.showModal(); }
  function closeAll() { container.querySelectorAll('dialog[open]').forEach((d) => d.close()); }
  function openBooking() { closeAll(); resetBooking(); open('#booking-dialog'); }
  const dock = () => $('.cta-dock');
  function setChannels(show) {
    const d = dock();
    if (!d) return;
    d.classList.toggle('is-closed', !show);
    d.querySelector('.dock-consult').setAttribute('aria-expanded', String(show));
  }
  function openConsult() { setChannels(true); }

  // 희망 날짜는 오늘 이후만
  function setMinDate() {
    const input = $('#bk-date');
    if (!input) return;
    const t = new Date();
    input.min = new Date(t.getTime() - t.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }
  function resetBooking() {
    const form = $('.booking-form');
    const done = $('.booking-done');
    if (!form || !done || done.hidden) return;
    form.reset();
    form.hidden = false;
    done.hidden = true;
  }

  // 예약·상담 버튼, 닫기, 바깥 클릭 닫기
  function onClick(e) {
    const t = e.target;
    if (t.closest('[data-close]')) { t.closest('dialog').close(); return; }
    if (t.closest('[data-book]')) { e.preventDefault(); openBooking(); return; }
    if (t.closest('.dock-consult')) { setChannels(dock().classList.contains('is-closed')); return; }
    if (t.closest('[data-consult]')) { e.preventDefault(); openConsult(); return; }
    const off = t.closest('[data-channel-off]');
    if (off) { bm.do('snackbar:open', { message: `${off.dataset.channelOff} 상담 채널을 준비 중이에요. 전화로 문의해 주세요.` }); return; }
    const info = t.closest('[data-info]');
    if (info) {
      const d = $('#section-dialog');
      d.querySelector('#section-title').textContent = info.dataset.info;
      if (!d.open) d.showModal();
      return;
    }
    if (t.matches('dialog')) {
      const r = t.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) t.close();
    }
  }

  // 연락처 입력 시 자동 하이픈
  function onInput(e) {
    if (e.target.name !== 'phone') return;
    const d = e.target.value.replace(/\D/g, '').slice(0, 11);
    e.target.value = d.length < 4 ? d : d.length < 8 ? `${d.slice(0, 3)}-${d.slice(3)}` : `${d.slice(0, 3)}-${d.slice(3, d.length - 4)}-${d.slice(-4)}`;
    e.target.removeAttribute('aria-invalid');
  }

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  // 비회원 글 작성에 필요한 비밀번호 (환자가 쓸 일은 없음)
  function randomPassword() {
    const chars = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const buf = new Uint32Array(12);
    crypto.getRandomValues(buf);
    return 'Ad!' + Array.from(buf, (n) => chars[n % chars.length]).join('') + '7';
  }

  let sending = false;
  async function onSubmit(e) {
    if (!e.target.matches('.booking-form')) return;
    e.preventDefault();
    if (sending) return;
    const form = e.target;
    const f = form.elements;
    const error = form.querySelector('.form-error');
    const fail = (msg, field) => {
      error.textContent = msg;
      if (field) { field.setAttribute('aria-invalid', 'true'); field.focus(); }
    };
    error.textContent = '';
    form.querySelectorAll('[aria-invalid]').forEach((el) => el.removeAttribute('aria-invalid'));

    const ctx = bm.context;
    const customer = ctx.customer;
    const name = f.name.value.trim();
    const phone = f.phone.value.trim();
    const emailInput = f.email;
    const email = emailInput ? emailInput.value.trim() : '';
    if (!name) return fail('이름을 입력해 주세요.', f.name);
    if (!/^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(phone)) return fail('연락처를 정확히 입력해 주세요.', f.phone);
    if (emailInput && (emailInput.required || email) && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('이메일 주소를 확인해 주세요.', emailInput);
    if (!f.agree.checked) return fail('개인정보 수집·이용에 동의해 주세요.', f.agree);

    const board = ctx.property.consultBoard;
    if (!board || !board.id) return fail('지금은 온라인 예약을 받을 수 없어요. 전화로 문의해 주세요.');

    const treatment = f.treatment.value;
    const rows = [
      ['이름', name], ['연락처', phone], ['이메일', email || '-'], ['상담 진료', treatment],
      ['희망 날짜', f.date.value || '상관없음'], ['희망 시간대', f.time.value], ['궁금한 점', f.message.value.trim() || '-'],
    ];
    const params = {
      boardId: board.id,
      title: `[${treatment}] ${name} 님 예약 신청`,
      contents: rows.map(([k, v]) => `<p><strong>${k}</strong> : ${esc(v).replace(/\n/g, '<br>')}</p>`).join(''),
      accessType: 'OPEN',
    };
    if (!customer) {
      params.userName = name;
      params.email = email || (ctx.social && ctx.social.email) || '';
      params.password = randomPassword();
    }

    const submit = form.querySelector('.submit-btn');
    sending = true;
    submit.disabled = true;
    submit.textContent = '보내는 중…';
    try {
      await bm.do('board:createPost', { params });
      form.hidden = true;
      $('.booking-done').hidden = false;
    } catch (err) {
      fail(`신청을 보내지 못했어요. 잠시 후 다시 시도하거나 전화로 문의해 주세요.${err && err.message ? ` (${err.message})` : ''}`);
    } finally {
      sending = false;
      submit.disabled = false;
      submit.textContent = '예약 신청하기';
    }
  }

  setMinDate();
  container.addEventListener('click', onClick);
  container.addEventListener('input', onInput);
  container.addEventListener('submit', onSubmit, true);
  // 다른 블록의 예약·상담 버튼에서 보내는 신호
  window.addEventListener('aneun:book', openBooking);
  window.addEventListener('aneun:consult', openConsult);
  bm.onContextChange = setMinDate;
  bm.onDestroy = () => {
    container.removeEventListener('click', onClick);
    container.removeEventListener('input', onInput);
    container.removeEventListener('submit', onSubmit, true);
    window.removeEventListener('aneun:book', openBooking);
    window.removeEventListener('aneun:consult', openConsult);
  };
</script>
