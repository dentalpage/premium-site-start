<template>
<div class="an-pad"><div class="an an-symptoms"><section id="symptoms" class="symptoms" aria-labelledby="symptoms-title"><header class="symptoms-heading"><div class="section-label">SYMPTOM CARE</div><h2 id="symptoms-title">어디가 불편하세요?<br><em>증상부터 편하게 말씀해 주세요.</em></h2><p>불편한 증상에서 시작해, 필요한 치료와 그 이유를 설명합니다.</p></header><div class="symptoms-layout"><div class="symptom-tabs" role="tablist" aria-label="불편한 증상 선택" aria-orientation="vertical"><button type="button" role="tab" id="tab-gum" aria-controls="panel-gum" aria-selected="true" tabindex="0">잇몸이 부었어요</button><button type="button" role="tab" id="tab-crown" aria-controls="panel-crown" aria-selected="false" tabindex="-1">씹을 때 찌릿해요</button><button type="button" role="tab" id="tab-resin" aria-controls="panel-resin" aria-selected="false" tabindex="-1">치아가 깨졌어요</button><button type="button" role="tab" id="tab-sensitivity" aria-controls="panel-sensitivity" aria-selected="false" tabindex="-1">이가 시려요</button><button type="button" role="tab" id="tab-wisdom" aria-controls="panel-wisdom" aria-selected="false" tabindex="-1">어금니 뒤가 아파요</button><button type="button" role="tab" id="tab-jaw" aria-controls="panel-jaw" aria-selected="false" tabindex="-1">입 벌리면 턱이 아파요</button><button type="button" role="tab" id="tab-implant" aria-controls="panel-implant" aria-selected="false" tabindex="-1">치아가 많이 흔들려요</button></div><div class="symptom-panels"><article role="tabpanel" id="panel-gum" aria-labelledby="tab-gum" tabindex="0"><h3>잇몸치료</h3><p class="treatment-intro">잇몸과 잇몸뼈의 상태를 확인하고, <br>염증의 범위에 맞는 치료를 안내합니다.</p><h4>아는치과는 이렇게 치료합니다</h4><ol class="treatment-steps"><li><span class="treatment-number" aria-hidden="true">01</span><h5>정밀 진단</h5><div class="treatment-reason"><p class="treatment-purpose">잇몸 염증의 범위를 확인하기 위해</p><p class="treatment-detail">잇몸 깊이와 검사자료를 함께 살펴 치료 범위를 정합니다.</p></div></li><li><span class="treatment-number" aria-hidden="true">02</span><h5>꼼꼼한 치석 제거</h5><div class="treatment-reason"><p class="treatment-purpose">염증을 일으키는 치석을 제거하기 위해</p><p class="treatment-detail">잇몸 상태에 맞춰 필요한 부위의 치석을 세심하게 제거합니다.</p></div></li><li><span class="treatment-number" aria-hidden="true">03</span><h5>필요시 추가 약물 처치</h5><div class="treatment-reason"><p class="treatment-purpose">염증 상태에 맞춰 치료를 보완하도록</p><p class="treatment-detail">필요한 경우 잇몸 부위의 약물 처치를 고려합니다.</p></div></li></ol><svg class="treatment-photo" viewBox="406 707 1134 281" preserveAspectRatio="xMidYMid slice" role="img" aria-label="잇몸치료 설명을 위한 치아 모형 및 진료 이미지"><image href="{{property.imgSymptomGum}}" width="1560" height="1008"></image></svg></article><article role="tabpanel" id="panel-crown" aria-labelledby="tab-crown" tabindex="0" hidden=""><h3>크라운 · 신경치료</h3><p class="treatment-intro">씹을 때 느껴지는 통증의 원인을 확인하고, <br>치아 상태에 맞는 치료를 결정합니다.</p><h4>아는치과는 이렇게 치료합니다</h4><ol class="treatment-steps"><li><span class="treatment-number" aria-hidden="true">01</span><h5>정밀 감별 후 치료 결정</h5><div class="treatment-reason"><p class="treatment-purpose">필요한 치료 범위를 판단하기 위해</p><p class="treatment-detail">균열과 신경 상태 등을 살펴 치료 방법을 결정합니다.</p></div></li><li><span class="treatment-number" aria-hidden="true">02</span><h5>맞춤 교합 크라운</h5><div class="treatment-reason"><p class="treatment-purpose">치아를 보호하고 씹는 힘을 고려하도록</p><p class="treatment-detail">보철물의 경계와 주변 치아의 맞물림을 세심하게 확인합니다.</p></div></li><li><span class="treatment-number" aria-hidden="true">03</span><h5>필요시 정밀 신경치료</h5><div class="treatment-reason"><p class="treatment-purpose">문제가 있는 신경관을 치료하기 위해</p><p class="treatment-detail">신경치료가 필요한 경우 신경관의 형태에 맞춰 세척과 치료를 진행합니다.</p></div></li></ol><svg class="treatment-photo" viewBox="411 679 1133 298" preserveAspectRatio="xMidYMid slice" role="img" aria-label="크라운 · 신경치료 설명을 위한 치아 모형 및 진료 이미지"><image href="{{property.imgSymptomCrown}}" width="1570" height="1002"></image></svg></article><article role="tabpanel" id="panel-resin" aria-labelledby="tab-resin" tabindex="0" hidden=""><h3>레진 · 인레이 치료</h3><p class="treatment-intro">치아의 손상 범위를 확인하고, <br>건강한 치아를 남기며 필요한 부위를 복원합니다.</p><h4>아는치과는 이렇게 치료합니다</h4><ol class="treatment-steps"><li><span class="treatment-number" aria-hidden="true">01</span><h5>최소 삭제 원칙</h5><div class="treatment-reason"><p class="treatment-purpose">건강한 치아를 더 남기기 위해</p><p class="treatment-detail">필요한 부위만 정리하고 남길 수 있는 치아를 보존합니다.</p></div></li><li><span class="treatment-number" aria-hidden="true">02</span><h5>3중 레이어링 레진</h5><div class="treatment-reason"><p class="treatment-purpose">주변 치아와 자연스럽게 어울리도록</p><p class="treatment-detail">치아의 색과 투명도를 고려해 여러 층으로 쌓아 복원합니다.</p></div></li><li><span class="treatment-number" aria-hidden="true">03</span><h5>손상 범위에 맞춘 인레이</h5><div class="treatment-reason"><p class="treatment-purpose">손상된 부위를 안정적으로 복원하도록</p><p class="treatment-detail">넓은 손상 부위는 인레이를 고려하고 접착 과정을 세심하게 진행합니다.</p></div></li></ol><svg class="treatment-photo" viewBox="431 655 1195 260" preserveAspectRatio="xMidYMid slice" role="img" aria-label="레진 · 인레이 치료 설명을 위한 치아 모형 및 진료 이미지"><image href="{{property.imgSymptomResin}}" width="1672" height="941"></image></svg></article><article role="tabpanel" id="panel-sensitivity" aria-labelledby="tab-sensitivity" tabindex="0" hidden=""><h3>치경부 마모증 치료</h3><p class="treatment-intro">시린 원인을 먼저 확인하고, <br>치아가 패이거나 뿌리가 노출된 부위에 맞는 치료를 안내합니다.</p><h4>아는치과는 이렇게 치료합니다</h4><ol class="treatment-steps"><li><span class="treatment-number" aria-hidden="true">01</span><h5>2회 코팅 처치</h5><div class="treatment-reason"><p class="treatment-purpose">시린 증상을 줄이기 위해</p><p class="treatment-detail">노출된 부위에 코팅제를 2회 도포합니다.</p></div></li><li><span class="treatment-number" aria-hidden="true">02</span><h5>잇몸 맞춤 레진 충전</h5><div class="treatment-reason"><p class="treatment-purpose">경계 부위까지 꼼꼼하게 채우기 위해</p><p class="treatment-detail">잇몸 가까운 부위까지 확인하며 레진을 채웁니다.</p></div></li><li><span class="treatment-number" aria-hidden="true">03</span><h5>3단계 연마</h5><div class="treatment-reason"><p class="treatment-purpose">이물감과 착색을 줄이기 위해</p><p class="treatment-detail">거친 연마부터 마무리 광택까지 표면을 다듬습니다.</p></div></li></ol><svg class="treatment-photo" viewBox="411 671 1140 315" preserveAspectRatio="xMidYMid slice" role="img" aria-label="치경부 마모증 치료 설명을 위한 치아 모형 및 진료 이미지"><image href="{{property.imgSymptomSensitivity}}" width="1569" height="1003"></image></svg></article><article role="tabpanel" id="panel-wisdom" aria-labelledby="tab-wisdom" tabindex="0" hidden=""><h3>사랑니 발치 치료</h3><p class="treatment-intro">사랑니의 위치와 주변 구조를 확인하고, <br>발치가 필요한지 먼저 판단합니다.</p><h4>아는치과는 이렇게 치료합니다</h4><ol class="treatment-steps"><li><span class="treatment-number" aria-hidden="true">01</span><h5>3D 정밀 진단 · 필요시</h5><div class="treatment-reason"><p class="treatment-purpose">치아 뿌리와 신경의 관계를 확인하기 위해</p><p class="treatment-detail">필요한 경우 CT로 주변 구조를 확인해 발치 계획을 세웁니다.</p></div></li><li><span class="treatment-number" aria-hidden="true">02</span><h5>상태에 맞춘 분할 발치</h5><div class="treatment-reason"><p class="treatment-purpose">주변 조직의 손상을 줄이기 위해</p><p class="treatment-detail">필요한 경우 치아를 나누어 주변 잇몸과 뼈를 고려하며 발치합니다.</p></div></li><li><span class="treatment-number" aria-hidden="true">03</span><h5>필요시 지혈제 처치</h5><div class="treatment-reason"><p class="treatment-purpose">발치 부위의 지혈을 돕기 위해</p><p class="treatment-detail">출혈과 상처 상태에 따라 콜라겐 지혈제 사용을 고려합니다.</p></div></li></ol><svg class="treatment-photo" viewBox="419 633 1222 290" preserveAspectRatio="xMidYMid slice" role="img" aria-label="사랑니 발치 치료 설명을 위한 치아 모형 및 진료 이미지"><image href="{{property.imgSymptomWisdom}}" width="1672" height="941"></image></svg></article><article role="tabpanel" id="panel-jaw" aria-labelledby="tab-jaw" tabindex="0" hidden=""><h3>턱관절 치료</h3><p class="treatment-intro">턱관절과 주변 근육의 상태를 살펴, <br>통증의 원인에 맞는 치료를 안내합니다.</p><h4>아는치과는 이렇게 치료합니다</h4><ol class="treatment-steps"><li><span class="treatment-number" aria-hidden="true">01</span><h5>턱관절 검사 · 정밀 촉진</h5><div class="treatment-reason"><p class="treatment-purpose">관절과 근육의 상태를 확인하기 위해</p><p class="treatment-detail">진찰과 필요한 영상검사를 통해 치료 방향을 정합니다.</p></div></li><li><span class="treatment-number" aria-hidden="true">02</span><h5>상태에 맞춘 물리치료</h5><div class="treatment-reason"><p class="treatment-purpose">턱 주변의 긴장과 불편을 줄이기 위해</p><p class="treatment-detail">증상에 따라 필요한 물리치료를 선택합니다.</p></div></li><li><span class="treatment-number" aria-hidden="true">03</span><h5>필요시 보톡스 · 스플린트</h5><div class="treatment-reason"><p class="treatment-purpose">근육과 관절에 가해지는 부담을 고려하도록</p><p class="treatment-detail">검사 결과에 따라 보톡스나 스플린트의 필요성을 판단합니다.</p></div></li></ol><svg class="treatment-photo" viewBox="434 619 1182 293" preserveAspectRatio="xMidYMid slice" role="img" aria-label="턱관절 치료 설명을 위한 치아 모형 및 진료 이미지"><image href="{{property.imgSymptomJaw}}" width="1672" height="941"></image></svg></article><article role="tabpanel" id="panel-implant" aria-labelledby="tab-implant" tabindex="0" hidden=""><h3>임플란트 치료</h3><p class="treatment-intro">흔들리는 치아를 살릴 수 있는지 먼저 확인하고, <br>필요한 경우 임플란트를 계획합니다.</p><h4>아는치과는 이렇게 치료합니다</h4><ol class="treatment-steps"><li><span class="treatment-number" aria-hidden="true">01</span><h5>뼈 상태 정밀 확인</h5><div class="treatment-reason"><p class="treatment-purpose">개인별 상태에 맞는 위치를 계획하도록</p><p class="treatment-detail">잇몸뼈의 양과 주변 구조를 함께 확인합니다.</p></div></li><li><span class="treatment-number" aria-hidden="true">02</span><h5>교합을 고려한 설계</h5><div class="treatment-reason"><p class="treatment-purpose">씹는 힘이 한곳에 집중되지 않도록</p><p class="treatment-detail">주변 치아와 맞물림을 고려해 보철물을 설계합니다.</p></div></li><li><span class="treatment-number" aria-hidden="true">03</span><h5>잇몸라인을 고려한 보철</h5><div class="treatment-reason"><p class="treatment-purpose">주변 잇몸과 자연스럽게 이어지도록</p><p class="treatment-detail">잇몸 상태를 고려해 보철물의 형태와 위치를 계획합니다.</p></div></li></ol><svg class="treatment-photo" viewBox="416 646 1224 277" preserveAspectRatio="xMidYMid slice" role="img" aria-label="임플란트 치료 설명을 위한 치아 모형 및 진료 이미지"><image href="{{property.imgSymptomImplant}}" width="1672" height="941"></image></svg></article></div></div><p class="symptom-note">같은 증상이라도 원인은 다를 수 있습니다. 검사 후 치아 상태에 맞는 치료를 안내합니다.</p></section></div></div>
</template>

<script>
  const container = bm.container;
  const tabs = () => [...container.querySelectorAll('.symptom-tabs [role="tab"]')];

  // 증상 탭 선택: 패널 전환 + 키보드 이동
  function selectSymptom(tab, focus) {
    tabs().forEach(item => {
      const selected = item === tab;
      item.setAttribute('aria-selected', String(selected));
      item.tabIndex = selected ? 0 : -1;
      const panel = container.querySelector('#' + item.getAttribute('aria-controls'));
      if (panel) panel.hidden = !selected;
    });
    if (focus) tab.focus();
  }
  function onClick(e) {
    const tab = e.target.closest('.symptom-tabs [role="tab"]');
    if (tab) selectSymptom(tab, false);
  }
  function onKey(e) {
    const list = tabs();
    const index = list.indexOf(e.target);
    if (index < 0) return;
    let next;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') next = (index + 1) % list.length;
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') next = (index - 1 + list.length) % list.length;
    if (e.key === 'Home') next = 0;
    if (e.key === 'End') next = list.length - 1;
    if (next !== undefined) { e.preventDefault(); selectSymptom(list[next], true); }
  }
  container.addEventListener('click', onClick);
  container.addEventListener('keydown', onKey);
  bm.onDestroy = () => {
    container.removeEventListener('click', onClick);
    container.removeEventListener('keydown', onKey);
  };
</script>
