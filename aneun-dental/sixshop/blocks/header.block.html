<template>
<div class="an-pad"><div class="an an-header"><header class="header" id="header"><a class="brand" href="/" aria-label="아는치과 처음으로">아는치과<span>ANEUN DENTAL</span></a><nav class="desktop-nav" aria-label="주요 메뉴"><a href="/#doctor">원장소개</a><a href="/#first-visit">첫방문</a><a href="/#symptoms">증상별 진료</a><a href="/#comfort">통증케어</a><a href="/#implant">임플란트</a><a href="/#location">오시는 길</a></nav><button class="header-book" type="button" data-book="">예약하기</button><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu">메뉴</button></header><nav class="mobile-menu" id="mobile-menu" aria-label="모바일 메뉴" hidden=""><a href="/#doctor">원장소개</a><a href="/#first-visit">첫방문</a><a href="/#symptoms">증상별 진료</a><a href="/#comfort">통증케어</a><a href="/#implant">임플란트</a><a href="/#location">오시는 길</a></nav></div></div>
</template>

<script>
  const container = bm.container;

  // 예약 버튼: 푸터 블록의 예약 안내 팝업을 연다
  function onBookClick(e) {
    if (e.target.closest('[data-book]')) {
      e.preventDefault();
      window.dispatchEvent(new CustomEvent('aneun:book'));
    }
  }
  container.addEventListener('click', onBookClick);

  function menuParts() {
    return { button: container.querySelector('.menu-toggle'), menu: container.querySelector('#mobile-menu') };
  }
  function closeMenu() {
    const { button, menu } = menuParts();
    if (!menu) return;
    menu.hidden = true;
    button.setAttribute('aria-expanded', 'false');
  }
  // 모바일 메뉴 열기/닫기, 메뉴 링크 누르면 닫기
  function onMenuClick(e) {
    const { button, menu } = menuParts();
    if (e.target.closest('.menu-toggle')) {
      const open = button.getAttribute('aria-expanded') !== 'true';
      button.setAttribute('aria-expanded', String(open));
      menu.hidden = !open;
    } else if (e.target.closest('#mobile-menu a')) {
      closeMenu();
    }
  }
  function onKey(e) { if (e.key === 'Escape') closeMenu(); }
  function onResize() { if (window.innerWidth > 860) closeMenu(); }
  container.addEventListener('click', onMenuClick);
  document.addEventListener('keydown', onKey);
  window.addEventListener('resize', onResize);

  // 현재 보고 있는 섹션의 메뉴에 밑줄 표시 (같은 페이지의 다른 블록 섹션을 관찰)
  let observer = null;
  if ('IntersectionObserver' in window) {
    observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const link = container.querySelector('.desktop-nav a[href$="#' + entry.target.id + '"]');
        if (!link) return;
        link.classList.toggle('is-active', entry.isIntersecting);
        if (entry.isIntersecting) link.setAttribute('aria-current', 'location');
        else link.removeAttribute('aria-current');
      });
    }, { rootMargin: '-90px 0px -35% 0px', threshold: 0 });
    setTimeout(() => {
      container.querySelectorAll('.desktop-nav a').forEach(a => {
        const target = document.getElementById(a.getAttribute('href').split('#')[1]);
        if (target) observer.observe(target);
      });
    }, 300);
  }

  bm.onDestroy = () => {
    container.removeEventListener('click', onBookClick);
    container.removeEventListener('click', onMenuClick);
    document.removeEventListener('keydown', onKey);
    window.removeEventListener('resize', onResize);
    if (observer) observer.disconnect();
  };
</script>
