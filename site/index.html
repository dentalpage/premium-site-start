<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>모두의치과 — 우리 아이 첫 치과</title>
  <meta name="description" content="첫 치과가 평생 치과 공포가 되지 않도록. 소아치과 전문의, 아이 전용 진료실, 첫 방문은 치료 없이, 보호자 진료실 동행." />
  <meta name="theme-color" content="#F6F4EE" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
  <style>
    :root, .sw-root {
      --sw-bg: #F6F4EE;
      --sw-ink: #163C45;
      --sw-ink-soft: #5A6B70;
      --sw-accent: #2E9C88;
      --sw-font-display: "Pretendard", system-ui, sans-serif;
      --sw-font-body: "Pretendard", system-ui, sans-serif;
      --surface: #FFFFFF;
      --line: #E3E0D6;
    }
    body { background: var(--sw-bg); color: var(--sw-ink); font-family: var(--sw-font-body); word-break: keep-all; }
    .sw-copy__title { letter-spacing: -0.03em; }
    .sw-copy__eyebrow { letter-spacing: .04em; }
    .sw-btn--primary { background: var(--sw-accent); }
    .sw-topcta { background: var(--sw-accent); }

    /* Fixed engine chrome steps aside once the booking form takes over. */
    body.at-reserve .sw-topbar,
    body.at-reserve .sw-route,
    body.at-reserve .sw-copylayer,
    body.at-reserve .sw-hint { opacity: 0; pointer-events: none; transition: opacity .3s; }

    .reserve {
      position: relative; z-index: 70;
      background: var(--sw-bg);
      padding: clamp(72px, 12vh, 140px) 16px clamp(64px, 10vh, 120px);
      border-top-left-radius: 32px; border-top-right-radius: 32px;
      box-shadow: 0 -24px 60px rgba(22, 60, 69, .08);
    }
    .reserve__inner { max-width: 560px; margin: 0 auto; }
    .reserve__eyebrow { color: var(--sw-accent); font-weight: 700; font-size: .85rem; letter-spacing: .04em; }
    .reserve h2 { font-size: clamp(1.9rem, 4.6vw, 3rem); line-height: 1.15; letter-spacing: -0.03em; margin: 12px 0 0; }
    .reserve__lead { color: var(--sw-ink-soft); font-size: 1.05rem; line-height: 1.6; margin: 16px 0 0; }
    .reserve__promise { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 8px; }
    .reserve__promise li { display: flex; gap: 10px; align-items: baseline; font-size: .98rem; }
    .reserve__promise li::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--sw-accent); transform: translateY(-2px); }

    form { margin-top: 36px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: clamp(20px, 4vw, 32px); display: grid; gap: 18px; }
    .field { display: grid; gap: 8px; }
    .field label, .field legend { font-weight: 700; font-size: .92rem; }
    .field small { color: var(--sw-ink-soft); font-weight: 400; }
    input[type=text], input[type=tel], select, textarea {
      font: inherit; font-size: 1rem; color: var(--sw-ink);
      padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: #FBFAF7;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--sw-accent); box-shadow: 0 0 0 4px rgba(46, 156, 136, .15); }
    textarea { min-height: 96px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    fieldset { border: 0; padding: 0; margin: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips input { position: absolute; opacity: 0; pointer-events: none; }
    .chips label { font-weight: 600; font-size: .9rem; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: #FBFAF7; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
    .chips input:checked + label { background: var(--sw-accent); border-color: var(--sw-accent); color: #fff; }
    .chips input:focus-visible + label { box-shadow: 0 0 0 4px rgba(46, 156, 136, .25); }
    .consent { display: flex; gap: 10px; align-items: flex-start; font-size: .88rem; color: var(--sw-ink-soft); line-height: 1.5; }
    .consent input { margin-top: 3px; accent-color: var(--sw-accent); width: 18px; height: 18px; }
    .submit { font: inherit; font-weight: 700; font-size: 1.05rem; color: #fff; background: var(--sw-accent); border: 0; border-radius: 999px; padding: 17px 24px; cursor: pointer; transition: transform .2s, box-shadow .2s; }
    .submit:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(46, 156, 136, .3); }
    .error { color: #B4472E; font-size: .85rem; min-height: 1em; }
    .done { display: none; text-align: center; padding: 24px 8px; }
    .done h3 { font-size: 1.4rem; margin: 0; }
    .done p { color: var(--sw-ink-soft); margin: 10px 0 0; line-height: 1.6; }
    form.is-done > :not(.done) { display: none; }
    form.is-done .done { display: block; }
    footer { position: relative; z-index: 70; background: var(--sw-bg); text-align: center; color: var(--sw-ink-soft); font-size: .82rem; padding: 0 16px 40px; }
    @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { .submit, input, select, textarea { transition: none; } }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

  <section class="reserve" id="reserve" aria-labelledby="reserve-title">
    <div class="reserve__inner">
      <span class="reserve__eyebrow">첫 방문 예약</span>
      <h2 id="reserve-title">치과랑 친해지는 날,<br />편하게 신청하세요</h2>
      <p class="reserve__lead">첫 방문에는 치료하지 않아요. 아이가 진료실과 먼저 친해지는 시간이에요.</p>
      <ul class="reserve__promise">
        <li>소아치과 전문의 10년차 원장</li>
        <li>아이 전용 진료실</li>
        <li>보호자 진료실 동행</li>
      </ul>

      <form id="reserve-form" novalidate>
        <div class="row">
          <div class="field">
            <label for="f-name">보호자 성함</label>
            <input id="f-name" name="name" type="text" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="f-phone">연락처</label>
            <input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" required />
          </div>
        </div>
        <div class="field">
          <label for="f-age">아이 나이</label>
          <select id="f-age" name="age" required>
            <option value="">선택해 주세요</option>
            <option>3세 미만</option>
            <option>3~4세</option>
            <option>5~6세</option>
            <option>7~9세</option>
            <option>10세 이상</option>
          </select>
        </div>
        <fieldset class="field">
          <legend>편한 시간대</legend>
          <div class="chips">
            <input type="radio" id="t-am" name="time" value="오전" required /><label for="t-am">오전</label>
            <input type="radio" id="t-pm" name="time" value="오후" /><label for="t-pm">오후</label>
            <input type="radio" id="t-any" name="time" value="상관없음" /><label for="t-any">상관없음</label>
          </div>
        </fieldset>
        <div class="field">
          <label for="f-note">걱정되는 점 <small>(선택)</small></label>
          <textarea id="f-note" name="note" placeholder="예) 예전에 치과에서 많이 울었어요"></textarea>
        </div>
        <label class="consent">
          <input type="checkbox" name="consent" required />
          <span>예약 상담을 위해 성함·연락처·아이 나이를 수집하고, 상담 후 파기하는 데 동의합니다.</span>
        </label>
        <p class="error" id="f-error" role="alert"></p>
        <button class="submit" type="submit">치과랑 친해지는 날 예약하기</button>
        <div class="done" role="status">
          <h3>신청이 접수되었어요</h3>
          <p>확인 후 연락드려 방문 날짜를 정할게요.<br />아이와 함께 편하게 오세요.</p>
        </div>
      </form>
    </div>
  </section>
  <footer>© 모두의치과</footer>

  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: '모두의치과', href: '#top' },
      cta: { label: '예약하기', href: '#reserve' },
      hint: '스크롤해서 둘러보기',
      nav: false,
      diveScroll: 1.4,
      crossfade: 0.08,
      sections: [
        { id: 'street', label: '동네 치과', still: 'assets/street.webp', clip: 'assets/vid/street.mp4',
          scroll: 1.6, linger: 0.4,
          eyebrow: '우리 아이 첫 치과', title: '첫 치과가 평생 치과 공포가 되지 않도록',
          body: '붙잡고 울리는 치료 대신, 아이가 괜찮아질 때까지 기다리는 동네 치과예요.' },
        { id: 'kidroom', label: '아이 전용 진료실', still: 'assets/kidroom.webp', clip: 'assets/vid/kidroom.mp4',
          linger: 0.35,
          eyebrow: '아이 전용 진료실', title: '어른 치과 의자가 아니에요',
          body: '아이 눈높이에 맞춘 아이 전용 진료실에서 만나요.', tags: ['아이 전용 진료실'] },
        { id: 'firstvisit', label: '첫 방문', still: 'assets/firstvisit.webp', clip: 'assets/vid/firstvisit.mp4',
          linger: 0.35,
          eyebrow: '첫 방문', title: '첫날은 치료하지 않아요',
          body: '의자에 앉아 보고, 거울로 이를 세어 보는 ‘치과랑 친해지는 날’이에요.', tags: ['첫 방문 치료 없음'] },
        { id: 'together', label: '보호자 동행', still: 'assets/together.webp', clip: 'assets/vid/together.mp4',
          linger: 0.35,
          eyebrow: '보호자 동행', title: '엄마 아빠는 바로 옆에',
          body: '보호자가 진료실에 함께 들어가, 아이 손이 닿는 곳에 있어요.', tags: ['보호자 진료실 동행'] },
        { id: 'doctor', label: '소아치과 전문의', still: 'assets/doctor.webp', clip: 'assets/vid/doctor.mp4',
          scroll: 1.6, linger: 0.4,
          eyebrow: '소아치과 전문의', title: '아이 치아는 소아치과 전문의에게',
          body: '10년차 소아치과 전문의가 우리 아이의 첫 치과를 함께해요.',
          cta: { primary: { label: '치과랑 친해지는 날 예약하기', href: '#reserve' } } },
      ],
      connectors: [],
    });

    const reserve = document.getElementById('reserve');
    new IntersectionObserver(([e]) => document.body.classList.toggle('at-reserve', e.isIntersecting), { threshold: 0.15 })
      .observe(reserve);

    const form = document.getElementById('reserve-form');
    const err = document.getElementById('f-error');
    form.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const phoneOk = /^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(form.phone.value.trim());
      if (!form.checkValidity() || !phoneOk) {
        err.textContent = !phoneOk && form.phone.value ? '연락처를 다시 확인해 주세요.' : '필수 항목과 동의를 확인해 주세요.';
        return;
      }
      err.textContent = '';
      // TODO: connect to the booking backend (e.g. Weegloo) before launch; nothing is sent yet.
      form.classList.add('is-done');
    });
  </script>
</body>
</html>
